name: Backend PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"

jobs:
  run_tests:
    name: Run Backend Tests (PR)
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: "test-groq-key"
      GEMINI_API_KEY: "test-gemini-key"
      DB_POSTGRES_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
      PINECONE_API_KEY: "test-pinecone-key"
      VOYAGE_API_KEY: "test-voyage-key"
      TINYFISH_API_KEY: "test-tinyfish-key"
      GOOGLE_CLIENT_ID: "test-google-client-id"
      GOOGLE_CLIENT_SECRET: "test-google-client-secret"
      REDIS_URL: "redis://localhost:6379/0"

      CHAT_STREAM_REQUESTS_PER_MINUTE: "10"
      CHAT_STREAM_REQUESTS_PER_HOUR: "100"

      GROQ_ORG_ID: "test-org"
      GROQ_OPENAI_RPM: "10"
      GROQ_META_RPM: "10"
      GROQ_OPENAI_TPM: "10000"
      GROQ_META_TPM: "10000"

      PAPERTRAIL_ENDPOINT: "https://example.com"
      PAPERTRAIL_TOKEN: "test-papertrail-token"

      LANGFUSE_SECRET_KEY: "test-langfuse-secret"
      LANGFUSE_PUBLIC_KEY: "test-langfuse-public"
      LANGFUSE_BASE_URL: "https://example.com"

      CONNECTOR_SECRET: "test-connector-secret"
      MONTHLY_TOKEN_CAP: "20000"
      FINANCE_MCP_URL: "https://example.com/mcp"
      FINANCE_MCP_TOKEN: "test-finance-mcp-token"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        working-directory: server
        run: uv venv

      - name: Install Dependencies
        working-directory: server
        run: uv pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: server
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml
