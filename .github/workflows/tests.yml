name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: Pytest & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      GROQ_API_KEY: "test-groq-key"
      DB_POSTGRES_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
      PINECONE_API_KEY: "test-pinecone-key"
      VOYAGE_API_KEY: "test-voyage-key"
      TAVILY_API_KEY: "test-tavily-key"
      REDIS_URL: "redis://localhost:6379/0"

      CHAT_STREAM_REQUESTS_PER_MINUTE: "10"
      CHAT_STREAM_REQUESTS_PER_HOUR: "100"

      GROQ_ORG_ID: "test-org"
      GROQ_OPENAI_RPM: "10"
      GROQ_META_RPM: "10"
      GROQ_OPENAI_TPM: "10000"
      GROQ_META_TPM: "10000"

      TAVILY_SEARCH_RPM: "10"

      PAPERTRAIL_ENDPOINT: "https://example.com"
      PAPERTRAIL_TOKEN: "test-papertrail-token"

      LANGFUSE_SECRET_KEY: "test-langfuse-secret"
      LANGFUSE_PUBLIC_KEY: "test-langfuse-public"
      LANGFUSE_BASE_URL: "https://example.com"

      CONNECTOR_SECRET: "test-connector-secret"

      SERPAPI_RPM: "10"
      SERPAPI_API_KEY: "test-serpapi-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: server/coverage.xml
          fail_ci_if_error: true
